<ion-header class="ion-no-border">
  <div class="custom-header">
    <button class="back-btn" type="button" (click)="voltar()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h1 class="header-title">Notificações</h1>
  </div>
</ion-header>

<ion-content class="bg-light">
  <div class="page-content">
    <div class="notification-group" *ngFor="let grupo of grupos">
      <h2 class="group-title">{{ grupo.titulo }}</h2>

      <div class="notification-card" *ngFor="let item of grupo.itens">
        <div class="icon-box" [ngClass]="item.tipo">
          <ion-icon *ngIf="item.tipo === 'cancelada'" name="close-outline"></ion-icon>
          <ion-icon *ngIf="item.tipo === 'agendada'" name="calendar-outline"></ion-icon>
          <ion-icon *ngIf="item.tipo === 'pagamento'" name="checkmark-outline"></ion-icon>
        </div>

        <div class="card-content">
          <h3 class="card-title">{{ item.titulo }}</h3>
          <p class="card-desc">{{ item.descricao }}</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<!-- Menu inferior mantido para consistência de navegação -->
<app-bottom-nav activeTab="inicio"></app-bottom-nav>
