<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-hero"><h1 class="auth-logo">Guidaz</h1></div>

  <main class="auth-page">
    <h2 class="auth-title auth-title--narrow">Entre na sua conta</h2>

    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      <label class="field">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" formControlName="email" placeholder="Insira o endereço de e-mail" autocomplete="email" inputmode="email" />
      </label>

      <label class="field">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input [type]="verSenha() ? 'text' : 'password'" formControlName="senha" placeholder="Digite sua senha" autocomplete="current-password" />
        <button type="button" class="icon-btn" (click)="verSenha.set(!verSenha())" [attr.aria-label]="verSenha() ? 'Ocultar senha' : 'Mostrar senha'">
          <ion-icon [name]="verSenha() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </label>

      <a class="auth-link auth-link--right" routerLink="/esqueci-senha">Esqueceu sua senha?</a>

      <button class="btn-primary" type="submit">Entrar</button>
    </form>

    <p class="auth-center">Ou entre com</p>

    <button type="button" class="btn-social btn-social--google" (click)="loginSocial('Google')">
      <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.200z"/>
        <path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.200C6.500 42.600 14.600 48 24 48z"/>
      </svg>
      Sign in with Google
    </button>

    <button type="button" class="btn-social btn-social--facebook" (click)="loginSocial('Facebook')">
      <ion-icon name="logo-facebook"></ion-icon> Sign in with Facebook
    </button>

    <button type="button" class="btn-social btn-social--apple" (click)="loginSocial('Apple')">
      <ion-icon name="logo-apple"></ion-icon> Sign in with Apple
    </button>

    <p class="auth-footer">Precisa de uma conta? <a routerLink="/cadastro"><strong>Cadastre-se</strong></a></p>
  </main>
</ion-content>
