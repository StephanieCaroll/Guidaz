<ion-content class="auth-bg ion-no-padding">
  
  <div class="header-glow">
    <img src="assets/logo.png" alt="Guidaz Logo" class="logo-img">
  </div>

  <div class="form-container">
    <h2 class="page-title">Entre na sua<br>conta</h2>

    <form [formGroup]="form" (ngSubmit)="entrar()">
      
      <ion-item class="custom-input" lines="none">
        <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input type="email" placeholder="Insira o endereço de e-mail" formControlName="email"></ion-input>
      </ion-item>

      <ion-item class="custom-input" lines="none">
        <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input [type]="verSenha() ? 'text' : 'password'" placeholder="Digite sua senha" formControlName="senha"></ion-input>
        
        <ion-button fill="clear" slot="end" (click)="verSenha.set(!verSenha())" class="eye-btn">
          <ion-icon [name]="verSenha() ? 'eye-outline' : 'eye-off-outline'" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>

      <div class="forgot-password">
        <a routerLink="/esqueci-senha">Esqueceu sua senha?</a>
      </div>

      <ion-button expand="block" type="submit" class="main-btn">
        Entrar
      </ion-button>

      <div class="divider">
        Ou entre com
      </div>

      <ion-button expand="block" class="social-btn google-btn" (click)="loginSocial('Google')">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHBhdGggZmlsbD0iI0VBNDMzNSIgZD0iTTI0IDkuNWMzLjU0IDAgNi43MSAxLjIyIDkuMjEgMy42bDYuODUtNi44NUMzNS45IDIuMzggMzAuNDcgMCAyNCAwIDE0LjYyIDAgNi41MSA1LjM4IDIuNTYgMTMuMjJsNy45OCA2LjE5QzEyLjQzIDEzLjcyIDE3Ljc0IDkuNSAyNCA5LjV6Ii8+PHBhdGggZmlsbD0iIzQyODVGNCIgZD0iTTQ2Ljk4IDI0LjU1YzAtMS41Ny0uMTUtMy4wOS0uMzgtNC41NUgyNHY5LjAyaDEyLjk0Yy0uNTggMi45Ni0yLjI2IDUuNDgtNC43OCA3LjE4bDcuNzMgNmM0LjUxLTQuMTggNy4wOS0xMC4zNiA3LjA5LTE3LjY1eiIvPjxwYXRoIGZpbGw9IiNGQkJDMDUiIGQ9Ik0xMC41MyAyOC41OWMtLjQ4LTEuNDUtLjc2LTIuOTktLjc2LTQuNTlzLjI3LTMuMTQuNzYtNC41OWwtNy45OC02LjE5Qy45MiAxNi40NiAwIDIwLjEyIDAgMjRjMCAzLjg4LjkyIDcuNTQgMi41NiAxMC43OGw3Ljk3LTYuMTl6Ii8+PHBhdGggZmlsbD0iIzM0QTg1MyIgZD0iTTI0IDQ4YzYuNDggMCAxMS45My0yLjEzIDE1Ljg5LTUuODFsLTcuNzMtNmMtMi4xNSAxLjQ1LTQuOTIgMi4zLTguMTYgMi4zLTYuMjYgMC0xMS41Ny00LjIyLTEzLjQ3LTkuOTFsLTcuOTggNi4xOUM2LjUxIDQyLjYyIDE0LjYyIDQ4IDI0IDQ4eiIvPjwvc3ZnPg==" class="google-icon" slot="start" alt="Google">
        Sign in with Google
      </ion-button>

      <ion-button expand="block" class="social-btn facebook-btn" (click)="loginSocial('Facebook')">
        <ion-icon name="logo-facebook" slot="start"></ion-icon>
        Sign in with Facebook
      </ion-button>

      <ion-button expand="block" class="social-btn apple-btn" (click)="loginSocial('Apple')">
        <ion-icon name="logo-apple" slot="start"></ion-icon>
        Sign in with Apple
      </ion-button>
    </form>

    <p class="register-link">
      Precisa de uma conta? <a routerLink="/cadastro">Cadastre-se</a>
    </p>
  </div>
</ion-content>
