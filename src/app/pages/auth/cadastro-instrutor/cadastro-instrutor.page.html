<ion-content class="auth-bg ion-no-padding">
  
  <div class="header-glow">
    <img src="assets/logo.png" alt="Guidaz Logo" class="logo-img">
  </div>

  <div class="form-container">
    <h2 class="page-title">Crie sua conta</h2>

    <form [formGroup]="form" (ngSubmit)="criarConta()" novalidate>
      
      <app-dados-pessoais [group]="form" />

      <hr class="divider-line" />

      <div class="form-grid">
        <div class="input-group full-width">
          <label for="categorias">Categorias de habilitação que leciona</label>
          <ion-select id="categorias" class="custom-select" formControlName="categorias" placeholder="Categorias" [multiple]="true" interface="popover" toggleIcon="chevron-down" expandedIcon="chevron-up">
            @for (c of categorias; track c) {
              <ion-select-option [value]="c">Categoria {{ c }}</ion-select-option>
            }
          </ion-select>
        </div>

        <div class="input-group full-width">
          <label class="section-subtitle">Dados do Veículo</label>
        </div>
        
        <div class="input-group">
          <label>Modelo</label>
          <ion-input class="direct-input" type="text" formControlName="veiculoModelo" placeholder="Ex: Chevrolet Onix"></ion-input>
        </div>
        <div class="input-group">
          <label>Ano</label>
          <ion-input class="direct-input" type="number" formControlName="veiculoAno" placeholder="Ex: 2022"></ion-input>
        </div>
        <div class="input-group">
          <label>Placa</label>
          <ion-input class="direct-input" type="text" formControlName="veiculoPlaca" placeholder="Ex: ABC-1D23"></ion-input>
        </div>

        <div class="input-group full-width mt-10">
          <label for="biografia">Breve biografia</label>
          <ion-textarea class="direct-textarea" id="biografia" formControlName="biografia" placeholder="Ex: Instrutor credenciado há mais de 5 anos..." maxlength="300" [autoGrow]="true" rows="2"></ion-textarea>
        </div>
      </div>

      <button class="main-btn" type="submit">Criar Conta</button>
    </form>
  </div>
</ion-content>
