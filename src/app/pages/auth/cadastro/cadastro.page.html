<ion-content class="auth-bg ion-no-padding">
  
  <div class="header-glow">
    <img src="assets/logo.png" alt="Guidaz Logo" class="logo-img">
  </div>

  <div class="form-container">
    <!-- Título agora será centralizado via CSS -->
    <h2 class="page-title">Crie sua conta</h2>

    <form [formGroup]="form" (ngSubmit)="proximo()" novalidate>
      
      <!-- Input de E-mail -->
      <ion-item class="custom-input" lines="none">
        <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input type="email" formControlName="email" placeholder="Insira o endereço de e-mail" autocomplete="email"></ion-input>
      </ion-item>

      <!-- Input de Senha -->
      <ion-item class="custom-input" lines="none">
        <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input [type]="verSenha() ? 'text' : 'password'" formControlName="senha" placeholder="Digite sua senha" autocomplete="new-password"></ion-input>
        
        <ion-button fill="clear" slot="end" (click)="verSenha.set(!verSenha())" class="eye-btn" type="button">
          <ion-icon [name]="verSenha() ? 'eye-outline' : 'eye-off-outline'" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>

      <!-- Input de Confirmar Senha -->
      <ion-item class="custom-input" lines="none">
        <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input [type]="verConfirmar() ? 'text' : 'password'" formControlName="confirmar" placeholder="Digite sua senha novamente" autocomplete="new-password"></ion-input>
        
        <ion-button fill="clear" slot="end" (click)="verConfirmar.set(!verConfirmar())" class="eye-btn" type="button">
          <ion-icon [name]="verConfirmar() ? 'eye-outline' : 'eye-off-outline'" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>

      <!-- Caixas de Seleção (Checkboxes) -->
      <div class="role-row">
        <button type="button" class="role-btn" (click)="perfil.set('instrutor')">
          <div class="checkbox-square" [class.checked]="perfil() === 'instrutor'">
            @if (perfil() === 'instrutor') { <ion-icon name="checkmark"></ion-icon> }
          </div>
          <span>Sou Instrutor</span>
        </button>

        <button type="button" class="role-btn" (click)="perfil.set('aluno')">
          <div class="checkbox-square" [class.checked]="perfil() === 'aluno'">
            @if (perfil() === 'aluno') { <ion-icon name="checkmark"></ion-icon> }
          </div>
          <span>Sou Aluno</span>
        </button>
      </div>

      <ion-button expand="block" type="submit" class="main-btn">
        Próximo
      </ion-button>
    </form>
    
    <p class="register-link">
      Já tem uma conta? <a routerLink="/login">Entrar</a>
    </p>

  </div>
</ion-content>
